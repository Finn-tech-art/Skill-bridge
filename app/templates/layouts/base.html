<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkillBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>

<div class="app-shell">
    <header class="navbar">
        <a class="brand" href="{{ url_for('test.home') }}">
            <span class="brand-mark">SB</span>
            <span>
                <strong>SkillBridge</strong>
                <small>Learn by exchanging real skills</small>
            </span>
        </a>

        <nav class="nav-links">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('skills.dashboard') }}">Dashboard</a>
                <a href="{{ url_for('skills.browse') }}">Browse</a>
                <a href="{{ url_for('skills.matches') }}">Matches</a>
                <a href="{{ url_for('exchange.sessions') }}">Sessions</a>
                <a href="{{ url_for('exchange.credit_history') }}">Credits</a>
                <a href="{{ url_for('auth.profile') }}">Profile</a>
                <a class="nav-cta" href="{{ url_for('auth.logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}">Login</a>
                <a class="nav-cta" href="{{ url_for('auth.register') }}">Create account</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% include "components/flash_message.html" %}
        {% block content %}{% endblock %}
    </main>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
